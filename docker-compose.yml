version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: amirmind-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-amirmind}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-amirmind123}
      POSTGRES_DB: ${DB_NAME:-amirmind_dev}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-amirmind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amirmind-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: amirmind-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amirmind-network

  # PgAdmin (Optional, for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: amirmind-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@amirmind.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - amirmind-network

  # Redis Commander (Optional, for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: amirmind-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - amirmind-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  amirmind-network:
    driver: bridge
